services:

  # --- DATABASE SECTION ---

  postgres-master:
    image: postgres:16
    container_name: postgres_master
    restart: always
    environment:
      POSTGRES_DB: ar_chemistry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_master_data:/var/lib/postgresql/data

  # Tạm giữ replica container, nhưng chưa cho PgPool sử dụng
  postgres-replica:
    image: postgres:16
    container_name: postgres_replica
    restart: always
    environment:
      POSTGRES_DB: ar_chemistry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data

  pgpool:
    image: pgpool/pgpool:latest
    container_name: pgpool
    restart: always
    depends_on:
      - postgres-master
    environment:
      PGPOOL_PARAMS_BACKEND_HOSTNAME0: postgres-master
      PGPOOL_PARAMS_BACKEND_PORT0: 5432

      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      PGPOOL_ENABLE_POOL_PASSWD: "on"

    volumes:
      - ./pgpool/pgpool.conf:/config/pgpool.conf:ro

  # --- CACHE SECTION ---

  redis:
    image: redis:7
    container_name: redis
    restart: always

  # --- BACKEND SECTION ---

  backend:
    build: .
    container_name: ar-chemistry-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://pgpool:9999/ar_chemistry
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      - pgpool
      - redis

volumes:
  postgres_master_data:
  postgres_replica_data: