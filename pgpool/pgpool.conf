# ============================================
# PgPool-II - AR Chemistry
# Temporary master-only configuration
# ============================================

listen_addresses = '*'
port = 9999

socket_dir = '/var/run/pgpool'
pcp_socket_dir = '/var/run/pgpool'
wd_ipc_socket_dir = '/var/run/pgpool'

# --- PostgreSQL backend ---

backend_hostname0 = 'postgres-master'
backend_port0 = 5432
backend_weight0 = 1
backend_flag0 = 'ALLOW_TO_FAILOVER'

# --- Connection pool ---

num_init_children = 32
max_pool = 4

# --- Authentication ---

enable_pool_hba = off

# --- Replica / Load balancing ---

master_slave_mode = off
load_balance_mode = off

# Replica chưa được rebuild
sr_check_period = 0

# Tạm tắt health check
health_check_period = 0

failover_on_backend_error = off