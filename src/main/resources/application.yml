server:
  port: ${SERVER_PORT}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH}

spring:
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  application:
    name: ${SPRING_APPLICATION_NAME:ar_chemistry}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  cache:
    type: redis
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO}
    open-in-view: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.ap-southeast-2.amazonaws.com/ap-southeast-2_wuMjdreND
  ai:
    openai:
      api-key: ${OPEN_ROUTER_API_KEY}

      # Route qua OpenRouter
      base-url: https://openrouter.ai/api

      chat:
        completions-path: /v1/chat/completions

        options:
          # Default model (bị ghi đè bởi app.ai.chat-model ở dưới cho luồng chat)
          model: deepseek/deepseek-chat-v3-0324:free

          # Optional
          temperature: 0.2
          max-tokens: 1000

      embedding:
        options:
          model: openai/text-embedding-3-small

app:
  elk:
    # Elasticsearch của bộ ELK — backend làm proxy đọc log cho Admin Portal.
    # Chạy trong docker-compose thì trỏ http://elasticsearch:9200.
    elasticsearch-url: ${ELASTICSEARCH_URL:http://localhost:9200}
  ai:
    # Chuỗi model dự phòng cho luồng chat gia sư, thử theo đúng thứ tự này.
    # Thứ tự dựa trên test thật ngày 2026-08-02: 4 câu hỏi Hoá học/model,
    # chấm theo ngôn ngữ, độ chính xác, độ trễ và tỉ lệ lỗi.
    #
    #   1. ling-3.0-flash   4/4  tb  1,9s  - nhanh nhất, tiếng Việt chuẩn, không LaTeX
    #   2. gemma-4-26b      4/4  tb 10,5s  - chất lượng cao nhất, LaTeX đã xử lý ở server
    #   3. gpt-oss-20b      3/4  tb 14,6s  - ổn nhưng chậm và thỉnh thoảng trả rỗng
    #   4. north-mini-code  3/4  tb 19,0s  - chậm (tới 34s), chỉ dùng làm chốt chặn
    #
    # ĐÃ XOÁ KHỎI CHUỖI (đều đã test và hỏng thật):
    #   google/gemma-4-31b-it        - HTTP 429 liên tục 6/6 lần, không dùng được
    #   nvidia/nemotron-3-super-120b - trả lời lẫn chữ Hán
    #   nvidia/nemotron-3-nano-30b   - lộ chain-of-thought tiếng Anh ra màn hình
    #   nvidia/nemotron-nano-9b-v2   - trả lời cụt giữa chừng
    #   nvidia/nemotron-nano-12b-vl  - sai kiến thức hoá học
    #   poolside/laguna-s + xs       - trả lời cụt giữa chừng
    #
    # LƯU Ý: OpenRouter free tier KHÔNG có model Gemini nào (chỉ có Gemma).
    # Muốn Gemini thật phải dùng key riêng từ Google AI Studio.
    #
    # Phải ghim model ID cụ thể — KHÔNG dùng alias auto-router như
    # "openrouter/free" vì nó chọn ngẫu nhiên model mỗi request nên output
    # không ổn định và hay lẫn chữ Hán/Hangul.
    # Danh mục free thay đổi liên tục: kiểm tra bằng GET /api/v1/models.
    chat-models: "${AI_CHAT_MODELS:inclusionai/ling-3.0-flash:free,google/gemma-4-26b-a4b-it:free,openai/gpt-oss-20b:free,cohere/north-mini-code:free}"

lbos:
  logging:
    logstash:
      host: ${LOGSTASH_HOST:localhost}
      port: ${LOGSTASH_PORT:5044}

logging:
  level:
    root: INFO
    com.chemistry.demo: INFO
    org.springframework.web: WARN

aws:
  access-key: ${AWS_ACCESS_KEY_ID}
  secret-key: ${AWS_SECRET_ACCESS_KEY}
  region: ${AWS_REGION}
  user_pool-id: ${AWS_USER_POOL_ID}

  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME}

admin:
  email: ${ADMIN_EMAIL}
  password: ${ADMIN_PASSWORD}
  temp-password: ${ADMIN_TEMPORARY_PASSWORD}

staff:
  email: ${STAFF_EMAIL}
  password: ${STAFF_PASSWORD}

google:
  play:
    package-name: ${GOOGLE_PLAY_PACKAGE_NAME}
    service-account-path: ${GOOGLE_PLAY_SERVICE_ACCOUNT_PATH:}
